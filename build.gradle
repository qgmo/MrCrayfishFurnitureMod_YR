// MrCrayfish's Furniture Mod 1.12.2（悠然服务器魔改版）。
// 构建：用 JDK 25 运行 Gradle（RetroFuturaGradle 2.x 要求），编译目标 Java 8，MCP stable 39 映射。
plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = "${property('mod_version')}-1.12.2"
group = 'com.mrcrayfish'

base {
    archivesName.set('furniture')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
    // 版本号只写在 gradle.properties 的 mod_version，构建时生成 Tags 类
    injectedTags.put('VERSION', project.property('mod_version'))
}

// 开发环境的样例网站 samples.yr（浏览器排版检查，见 web.DevSamples）：gradlew runClient -PbrowserDevSamples=<样例目录>
if (project.hasProperty('browserDevSamples')) {
    minecraft.extraRunJvmArguments.add('-Dcfm.browser.devSamples=' + project.property('browserDevSamples'))
}

tasks.named('injectTags').configure {
    outputClassName.set('com.mrcrayfish.furniture.Tags')
}

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        name = 'BlameJared Maven'
    }
    maven {
        // 工业时代 2 的 API（可选依赖，只编译）
        url = 'https://maven.ic2.player.to'
        name = 'IC2 Maven'
        content {
            includeGroup 'net.industrial-craft'
        }
    }
    mavenCentral()
}

configurations {
    // 打进模组 jar 的库（只有 Java 类；本地库不打包，玩家第一次用时按平台下载，见 client.tv.NativeLibs）
    shade
    implementation.extendsFrom shade
    // 浏览器内核 openhtmltopdf（LGPL-2.1 或更高，纯 Java，Java 8）：类原样打进模组 jar，许可证放在 META-INF/openhtmltopdf/
    embed
    implementation.extendsFrom(embed)
    // 浏览器的 HTML 解析器 jsoup（MIT，支持 Java 8）：类原样打进模组 jar，许可证在 META-INF/jsoup/LICENSE（jsoup 自带的位置）
    embedJsoup
    implementation.extendsFrom(embedJsoup)
}

// YouranMod（悠然服务器模组，游戏内网络）：家具 fork 直接依赖它。它没有发布到 Maven，用它构建出来的 dev jar（未混淆）编译、
// 跑开发环境与单元测试；路径用 -Pyouranmod_jar=... 指定，默认 libs/youranmod-dev.jar（不进仓库）
def youranmodJar = file(providers.gradleProperty('youranmod_jar').getOrElse('libs/youranmod-dev.jar'))

dependencies {
    // 电视播放视频：JavaCV / JavaCPP / FFmpeg 的 Java 部分（Apache-2.0；FFmpeg 本地库是 LGPL 版）。
    // 不要传递依赖（javacv 的 pom 会拉进 OpenCV 等用不到的预设）。版本须与 NativeLibs 里写死的本地库一致。
    shade('org.bytedeco:javacv:1.5.14') { transitive = false }
    shade('org.bytedeco:javacpp:1.5.14') { transitive = false }
    shade('org.bytedeco:ffmpeg:8.1.2-1.5.14') { transitive = false }

    embed 'at.datenwort.openhtmltopdf:openhtmltopdf-core:1.1.4'
    embed 'at.datenwort.openhtmltopdf:openhtmltopdf-java2d:1.1.4'
    embedJsoup('org.jsoup:jsoup:1.22.2') { transitive = false }
    implementation files(youranmodJar)

    compileOnly rfg.deobf('CraftTweaker2:CraftTweaker2-API:1.12-4.1.20.675')
    compileOnly rfg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.675')
    compileOnly rfg.deobf('CraftTweaker2:ZenScript:1.12-4.1.20.675')

    // 工业时代 2（与现网同版本）：可选依赖，只编译 API 包，不打包；数字时钟用它的电器管理器取电，
    // 没装 IC2 时不加载相关的类（见 compat.ClockBatteries）
    compileOnly 'net.industrial-craft:industrialcraft-2:2.8.221-ex112:api'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'mod_version', project.property('mod_version')
    filesMatching('mcmod.info') {
        expand('mod_version': project.property('mod_version'))
    }
}

jar {
    // 把 JavaCV 等的类并进模组 jar；Java 9+ 的 module-info、多版本目录、签名去掉（Forge 1.12 扫描 jar 时不认）
    from({ configurations.shade.collect { zipTree(it) } }) {
        exclude 'module-info.class', 'META-INF/**', '**/package-info.class'
        // Maven 插件、OpenCL 内核等用不到的部分
        exclude 'org/bytedeco/javacpp/tools/*Mojo*', 'org/bytedeco/javacv/*.cl'
    }
    // openhtmltopdf 原样并进来（不改包名）；它的许可证、说明改放到 META-INF/openhtmltopdf/ 下
    from({ configurations.embed.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/maven/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        eachFile { f ->
            if (f.path.startsWith('META-INF/')) {
                f.path = 'META-INF/openhtmltopdf/' + f.path.substring('META-INF/'.length())
            }
        }
    }
    // jsoup 原样并进来（不改包名）；Java 11 的多版本类、module-info 去掉（Forge 1.12 扫描 jar 时不认），LICENSE 留在 META-INF/jsoup/
    from({ configurations.embedJsoup.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/maven/**', 'META-INF/versions/**', 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title": "MrCrayfish's Furniture Mod",
                "Specification-Vendor": "MrCrayfish",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"MrCrayfish",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
}

// 浏览器排版检查（工具，不是测试）：把仓库自带的样例页面和样例目录里各网站的页面渲染成 PNG 并检查排版，问题写进出图目录的 report.txt。
// gradlew browserLayoutShots -PlayoutSamples=<样例目录，- 为只画自带的> -PlayoutShots=<出图目录> [-PlayoutScale=1.5]
tasks.register('browserLayoutShots', JavaExec) {
    group = 'verification'
    description = '把样例页面渲染成 PNG 并做排版检查'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mrcrayfish.furniture.client.browser.LayoutShots'
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    jvmArgs '-Djava.awt.headless=true', '-Dfile.encoding=UTF-8'
    doFirst {
        args = [project.property('layoutSamples'), project.property('layoutShots'), project.findProperty('layoutScale') ?: '1.5']
    }
}
