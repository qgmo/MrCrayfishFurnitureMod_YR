// MrCrayfish's Furniture Mod 1.12.2（悠然服务器魔改版）。
// 构建：用 JDK 25 运行 Gradle（RetroFuturaGradle 2.x 要求），编译目标 Java 8，MCP stable 39 映射。
plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = "${property('mod_version')}-1.12.2"
group = 'com.mrcrayfish'

base {
    archivesName.set('furniture')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
    // 版本号只写在 gradle.properties 的 mod_version，构建时生成 Tags 类
    injectedTags.put('VERSION', project.property('mod_version'))
}

tasks.named('injectTags').configure {
    outputClassName.set('com.mrcrayfish.furniture.Tags')
}

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        name = 'BlameJared Maven'
    }
    maven {
        // 工业时代 2 的 API（可选依赖，只编译）
        url = 'https://maven.ic2.player.to'
        name = 'IC2 Maven'
        content {
            includeGroup 'net.industrial-craft'
        }
    }
    mavenCentral()
}

dependencies {
    compileOnly rfg.deobf('CraftTweaker2:CraftTweaker2-API:1.12-4.1.20.675')
    compileOnly rfg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.675')
    compileOnly rfg.deobf('CraftTweaker2:ZenScript:1.12-4.1.20.675')

    // 工业时代 2（与现网同版本）：可选依赖，只编译 API 包，不打包；数字时钟用它的电器管理器取电，
    // 没装 IC2 时不加载相关的类（见 compat.ClockBatteries）
    compileOnly 'net.industrial-craft:industrialcraft-2:2.8.221-ex112:api'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'mod_version', project.property('mod_version')
    filesMatching('mcmod.info') {
        expand('mod_version': project.property('mod_version'))
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": "MrCrayfish's Furniture Mod",
                "Specification-Vendor": "MrCrayfish",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"MrCrayfish",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
}
