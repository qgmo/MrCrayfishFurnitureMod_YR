name: Run Gradle Build
on:
  push:
    branches:
      - "1.12.2"
  pull_request:
    branches:
      - "1.12.2"

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.1.1

      # RetroFuturaGradle 需要 JDK 25 跑 Gradle；编译用的 JDK 8 由 settings.gradle 里的 foojay 插件自动下载
      - name: Setup Java
        uses: actions/setup-java@v4.0.0
        with:
          distribution: temurin
          java-version: 25

      # 家具 fork 依赖 YouranMod（游戏内网络），先构建它的 dev jar
      - name: Checkout YouranMod
        uses: actions/checkout@v4.1.1
        with:
          repository: qgmo/YouranMod
          ref: master
          path: youranmod

      - name: Build YouranMod
        working-directory: youranmod
        run: chmod +x gradlew && ./gradlew jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Execute Gradle build
        run: ./gradlew build -Pyouranmod_jar=youranmod/build/libs/youranmod-2.0.0-dev.jar

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4.3.0
        with:
          name: built-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
